name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main         # change to your default branch if different
  workflow_dispatch:   # allows manual run from Actions UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # change if you need a different Node version

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build      # ensure this produces a `dist/` directory

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist      # change to ./public or ./docs if that's your output
          publish_branch: gh-pages # branch to push the built files to
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_history: true
